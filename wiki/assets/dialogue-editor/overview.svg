<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dialogue Editor overview</title>
  <desc id="desc">Sample layout diagram with a node list, central canvas, inspector, and toolbar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18202a"/>
      <stop offset="100%" stop-color="#0f141b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243140"/>
      <stop offset="100%" stop-color="#1a2330"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dc1ff"/>
      <stop offset="100%" stop-color="#6a8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
